<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Biberzade Menü</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #D84315;
      --primary-soft: #fff3e0;
      --bg: #FAFAFA;
      --surface: #ffffff;
      --text-main: #2D2D2D;
      --text-muted: #757575;
      --border: #ECEFF1;

      --radius: 16px;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --max-width: 1000px;
      --header-height: 70px;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --surface: #1E1E1E;
      --text-main: #E0E0E0;
      --text-muted: #A0A0A0;
      --border: #333333;
      --primary-soft: rgba(216, 67, 21, 0.15);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      padding-bottom: 80px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header.appbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--primary-soft);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .brand-text span {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      text-transform: uppercase;
    }

    .search-container {
      margin-top: calc(var(--header-height) + 20px);
      padding: 0 20px;
      max-width: var(--max-width);
      margin-left: auto;
      margin-right: auto;
    }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease, background-color 0.3s ease;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(216, 67, 21, 0.15);
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
    }

    .main-container {
      max-width: var(--max-width);
      margin: 20px auto;
      padding: 0 20px;
      display: flex;
      gap: 30px;
    }

    .category-nav {
      width: 240px;
      flex-shrink: 0;
    }

    .cat-list {
      list-style: none;
      padding: 0;
      margin: 0;
      position: sticky;
      top: 100px;
    }

    .cat-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      transition: all 0.2s, background-color 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cat-item:hover {
      background: var(--bg);
      color: var(--primary);
    }

    .cat-item.active {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(216, 67, 21, 0.3);
    }

    .content-area {
      flex: 1;
    }

    .section-header {
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .section-header h2 {
      margin: 0;
      font-size: 24px;
      color: var(--text-main);
    }

    .section-header p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border-color: var(--primary-soft);
    }

    .card-img-container {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      background: var(--bg);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .card:hover .card-img {
      transform: scale(1.05);
    }

    .item-title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .item-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
      min-height: 36px;
    }

    .item-price {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary);
      background: var(--primary-soft);
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        padding: 0 16px;
        gap: 0;
      }

      .category-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid var(--border);
        z-index: 999;
        padding: 10px 16px;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
        overflow-x: auto;
        white-space: nowrap;
        white-space: nowrap;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .category-nav::-webkit-scrollbar {
        display: none;
      }

      .cat-list {
        position: static;
        display: flex;
        gap: 10px;
      }

      .cat-item {
        margin: 0;
        flex: 0 0 auto;
        padding: 8px 16px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        font-size: 14px;
      }

      .cat-item.active {
        border-color: var(--primary);
      }

      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .card {
        padding: 12px;
      }

      .item-title {
        font-size: 14px;
      }

      .item-price {
        font-size: 15px;
        padding: 4px 10px;
      }

      .item-desc {
        display: none;
      }

    }

    body {
      padding-bottom: 80px;
    }

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    /* --- Biberzade Banner --- */
    .promo-banner {
      background: linear-gradient(135deg, #D84315 0%, #FF7043 100%);
      color: white;
      padding: 30px;
      border-radius: var(--radius);
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(216, 67, 21, 0.25);
    }

    .promo-content {
      z-index: 2;
      max-width: 60%;
    }

    .promo-content h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .promo-content p {
      margin: 0 0 20px;
      opacity: 0.9;
    }

    .promo-btn {
      background: white;
      color: var(--primary);
      border: none;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .promo-btn:hover {
      transform: scale(1.05);
    }

    .promo-img {
      position: absolute;
      right: -20px;
      bottom: -20px;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      color: rgba(255, 255, 255, 0.4);
      transform: rotate(-15deg);
    }

    /* --- Developer Footer --- */
    .developer-footer {
      text-align: center;
      padding: 40px 20px;
      margin-top: 40px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .dev-profile {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 50px;
      transition: background 0.2s;
    }

    .dev-profile:hover {
      background: var(--bg);
    }

    .dev-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
    }

    .dev-info {
      text-align: left;
    }

    .dev-info h4 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .dev-info span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      transition: all 0.2s;
      text-decoration: none;
    }

    .social-btn:hover {
      background: var(--bg);
      color: #E1306C;
      border-color: #E1306C;
    }

    /* Theme Toggle Button */
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    .theme-toggle:hover {
      background-color: var(--bg);
    }

    .theme-toggle svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.5s ease;
    }

    [data-theme="dark"] .theme-toggle .sun-icon {
      display: none;
    }

    [data-theme="light"] .theme-toggle .moon-icon {
      display: none;
    }

    /* Default handling if no attribute set (light mode default in CSS via variables) */
    :root:not([data-theme="dark"]) .theme-toggle .sun-icon {
      display: none;
      /* Show moon by default for light mode */
    }

    :root:not([data-theme="dark"]) .theme-toggle .moon-icon {
      display: block;
    }

    /* Correct logic: 
       Light Mode -> Show Moon (to switch to dark)
       Dark Mode -> Show Sun (to switch to light)
    */

    [data-theme="light"] .moon-icon {
      display: block;
    }

    [data-theme="light"] .sun-icon {
      display: none;
    }

    [data-theme="dark"] .moon-icon {
      display: none;
    }

    [data-theme="dark"] .sun-icon {
      display: block;
    }
  </style>
</head>

  <div class="main-container">

    <main class="content-area">

      <div class="promo-banner">

          <p>Gerçek acının ve lezzetin buluşma noktası. Özel soslu dürümlerimizi denediniz mi?</p>
          <button class="promo-btn"
            onclick="document.getElementById('productsGrid').scrollIntoView({behavior: 'smooth'})">Hemen İncele</button>
        </div>
        <div class="promo-img">
          <span>🌶️</span>
        </div>
      </div>

      <div class="section-header">
        <h2 id="catTitle">Menü</h2>
        <p id="catDesc">Lezzetlerimizi keşfedin</p>
      </div>

      <div class="grid" id="productsGrid">
      </div>
    </main>

  </div>

    const data = [
      {
        id: 'durumler',

        items: [
          { name: 'Klasik Dürüm', price: '75₺', desc: 'Özel sos, yeşillik' },
          { name: 'Klasik Maxi Dürüm', price: '100₺', desc: 'Daha bol malzeme' },

          { name: 'Crunchy Dürüm', price: '80₺', desc: 'Çıtır kaplamalı' },
          { name: 'Crunchy Maxi', price: '120₺', desc: '' },
          { name: 'Cheddar Dürüm', price: '100₺', desc: 'Erimiş cheddar peynirli' },
          { name: 'Cheddar Maxi', price: '130₺', desc: '' },
          { name: 'Tavuk Füme Dürüm', price: '90₺', desc: 'İsli tavuk lezzeti' },
          { name: 'Hindi Füme Dürüm', price: '100₺', desc: 'Hafif ve lezzetli' },

          { name: 'Ton Balıklı', price: '160₺', desc: 'Protein deposu' }
        ]
      },
      {
        id: 'sushi',
        title: 'Sushi Rolls',
        desc: 'Uzak doğu esintili özel sarımlar',
        items: [
          { name: 'Classic Roll', price: '160₺' },
          { name: 'California Roll', price: '170₺', desc: 'Yengeç, avokado, salatalık' },
          { name: 'Crunchy Roll', price: '160₺', desc: 'Çıtır soğanlı' },
          { name: 'Spicy Roll', price: '160₺', desc: 'Acı sevenlere özel' },
          { name: 'Cheddar Roll', price: '160₺' },
          { name: 'Mix Roll', price: '330₺', desc: 'Karışık lezzet tabağı' }
        ]
      },
      {
        id: 'takolar',
        title: 'Takolar',
        desc: 'Meksika mutfağının vazgeçilmezi',
        items: [
          { name: "1'li Tako", price: '110₺' },
          { name: "2'li Tako", price: '220₺' },
          { name: "4'lü Tako", price: '440₺' }
        ]
      },
      {
        id: 'mezeler',
        title: 'Mezeler',
        desc: 'Ana yemeğin en iyi eşlikçileri',
        items: [
          { name: 'Meksika Atom', price: 'Sorunuz' },
          { name: 'Patlıcan Şakşuka', price: 'Sorunuz' },
          { name: 'Macar Ciğerli Tavuk', price: 'Sorunuz' }
        ]
      },
      {
        id: 'icecekler',
        title: 'İçecekler',
        desc: 'Serinletici seçenekler',
        items: [
          { name: 'Kutu İçecek', price: '40₺' },
          { name: 'Ayran (Küçük)', price: '30₺' },
          { name: 'Ayran (Büyük)', price: '35₺' },
          { name: 'Şalgam', price: '35₺' }
        ]
      }
    ];

    const catListEl = document.getElementById('catList');
    const productsGrid = document.getElementById('productsGrid');
    const catTitle = document.getElementById('catTitle');
    const catDesc = document.getElementById('catDesc');
    const searchInput = document.getElementById('searchInput');

    let currentCatId = data[0].id;


    function renderCategories() {
      catListEl.innerHTML = '';
      data.forEach(cat => {
        const li = document.createElement('li');
        li.className = `cat-item ${cat.id === currentCatId ? 'active' : ''}`;
        li.textContent = cat.title;
        li.onclick = () => {
          currentCatId = cat.id;
          renderCategories();
          renderProducts();
          if (window.innerWidth < 768) {
            window.scrollTo({ top: 100, behavior: 'smooth' });
          }
        };
        catListEl.appendChild(li);
      });
    }

    function renderProducts(filter = '') {
      productsGrid.innerHTML = '';

      let itemsToShow = [];
      let activeCatData = data.find(c => c.id === currentCatId);

      if (filter) {
        catTitle.textContent = "Arama Sonuçları";
        catDesc.textContent = `"${filter}" için bulunanlar`;

        data.forEach(cat => {
          const filtered = cat.items.filter(item =>
            item.name.toLowerCase().includes(filter.toLowerCase())
          );
          if (filtered.length > 0) {
            itemsToShow.push(...filtered);
          }
        });
      } else {
        catTitle.textContent = activeCatData.title;
        catDesc.textContent = activeCatData.desc;
        itemsToShow = activeCatData.items;
      }

      if (itemsToShow.length === 0) {
        productsGrid.innerHTML = `<div class="no-result">Aradığınız kriterde ürün bulunamadı.</div>`;
        return;
      }

      itemsToShow.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const imgUrl = item.img || `https://via.placeholder.com/400x400/eee/D84315?text=${item.name.charAt(0)}`;

        card.innerHTML = `
          <div class="card-img-container">
            <img src="${imgUrl}" alt="${item.name}" class="card-img" loading="lazy">
          </div>
          <div class="item-title">${item.name}</div>
          <div class="item-desc">${item.desc || ''}</div>
          <div class="item-price">${item.price}</div>
        `;
        productsGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      renderProducts(e.target.value.trim());
    });

    renderCategories();
    renderProducts();

    // Theme Toggle Logic
    const themeToggleBtn = document.getElementById('themeToggle');
    const rootElement = document.documentElement;
    const sunIcon = themeToggleBtn.querySelector('.sun-icon');
    const moonIcon = themeToggleBtn.querySelector('.moon-icon');

    // Check saved preference or system preference
    const savedTheme = localStorage.getItem('theme');
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

    // Set initial theme
    const initialTheme = savedTheme || systemTheme;
    rootElement.setAttribute('data-theme', initialTheme);
    if (initialTheme === 'dark') {
      sunIcon.style.display = 'none';
      moonIcon.style.display = 'inline-block';
    } else {
      sunIcon.style.display = 'inline-block';
      moonIcon.style.display = 'none';
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = rootElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

      rootElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);

      // Toggle icon visibility
      if (newTheme === 'dark') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'inline-block';
        moonIcon.style.transform = 'rotate(360deg)';
        setTimeout(() => moonIcon.style.transform = '', 500);
      } else {
        sunIcon.style.display = 'inline-block';
        moonIcon.style.display = 'none';
        sunIcon.style.transform = 'rotate(360deg)';
        setTimeout(() => sunIcon.style.transform = '', 500);
      }
    });
  </script>
